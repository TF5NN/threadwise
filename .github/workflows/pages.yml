name: Check and publish

# 1. check   — runs the checks in test/ and validation/ (no packages to install).
# 2. deploy  — publishes to GitHub Pages, only if the checks passed.
# The site is plain static files, so there is no build step; publishing only stamps the
# version into index.html (see "Stamp the version").
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html favicon.svg LICENSE css js _site/
      # The one change made on publishing: the "?v=dev" stamps in index.html become this
      # commit's short id, so browsers load the new files instead of old cached ones.
      - name: Stamp the version
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
